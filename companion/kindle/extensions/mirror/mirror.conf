# Mac running server.py — find its IP with `ipconfig getifaddr en0`
# or run ./sync-ip.sh to set this from the Mac's current address and copy
# it to a mounted Kindle.
SERVER=http://192.0.2.1:8765
# seconds to let the reader app start rendering after a click before polling
# for the new frame (the plugin polls until the frame changes, so this is a
# short head start, not a hard wait)
SETTLE=0.3
