# yb-reader takeover job.
#
# Fires whenever the framework job ends up stopped - which includes its
# DONT_START_FRAMEWORK early exit - and hands the device to the reader
# via boot.sh. The flag file in /mnt/us is the enable bit: without it
# boot.sh is a no-op and stock mode is untouched, so this job may sit
# dormant on any device without changing behavior.
#
# deploy: cp to /etc/upstart/yb-reader.conf (rootfs must be remounted rw
# for the copy; the jailbreak's kmc.conf proves the path is writable)
# and run `initctl reload`.

start on stopped framework
# Shutdown only. Deliberately NOT `starting framework`: the stock USB
# plug path pokes the framework to start (its drive-mode dialog), the
# event fires mid-plug, and upstart TERMed our process group exactly
# when boot.sh needed to park at its unplug wait — frozen device, no
# respawn, no fallback (found live 2026-08-25). The flag file is the
# real mutex: Amazon's framework.conf pre-start exits when
# DONT_START_FRAMEWORK exists, and exit-42 removes the flag and exits
# 0 — a normal exit, the job stops on its own.
stop on stopping lab126_gui

normal exit 0 42

# Keep respawning through crashes; boot.sh's own counter decides when to
# stop trying and fall back to the stock framework.
respawn
respawn limit 10 600

exec /mnt/us/extensions/reader/bin/boot.sh
