[package]
name = "ybdev"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
miniz_oxide = "0.8"
png = "0.17"
# JPEG for screensaver photos; same version/features as yread, so the
# lockfile gains nothing new.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
