[package]
name = "yb-reader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ybdev = { path = "../ybdev" }
yui = { path = "../yui" }
yread = { path = "../yread" }
hypher = "0.1"
libc = "0.2"
mupdf = { version = "0.7", default-features = false, features = ["epub", "cbz", "img"] }
qrcode = { version = "0.14", default-features = false }
pulldown-cmark = { version = "0.12", default-features = false }
flate2 = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
lzma-rs = "0.3"
memchr = "2.7"

[dev-dependencies]
# UI snapshot dumps (renders_both_tabs_to_png) — already in the lockfile
# as a transitive dep, so this adds no new build.
png = "0.17"
